<!doctype html>
<title>Quiz</title>

<h1>Quiz Game</h1>
<p>{{ question_number }}. {{ question.question }}</p>

<form method="post" action="/answer">
  {% for choice in question.choices %}
    <label>
      <input type="radio" name="answer" value="{{ choice }}" required>
      {{ choice }}
    </label><br>
  {% endfor %}

  <button type="submit">Submit</button>
</form>
