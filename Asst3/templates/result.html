<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Quiz Result</title>
</head>
<body>
    <h1>Your Quiz Result</h1>

<p>
    Overall score:
    {{ score }} out of {{ total }} points
</p>

<h2>Score by Category</h2>

<ul>
{% for category, earned in category_scores.items() %}
    <li>
        {{ category }}:
        {{ earned }} out of {{ category_totals[category] }} points
    </li>
{% endfor %}
</ul>

<a href="{{ url_for('setup') }}">Take Another Quiz</a>
</body>
</html>
