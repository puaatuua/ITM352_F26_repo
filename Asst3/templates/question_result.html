<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <title>Answer Result</title>
</head>
<body>
    {% if correct %}
        <h1>Correct!</h1>
    {% else %}
        <h1>Incorrect</h1>
        <p>The correct answer is <strong>{{ correct_answer }}</strong>.</p>
    {% endif %}

    <p>Your answer: {{ user_answer }}</p>
    <p>{{ explanation }}</p>

    <a href="{{ url_for('quiz') }}">Next Question</a>
</body>
</html>
